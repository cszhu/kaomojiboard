<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>kaomojiBoard</title>

  <!--Data + logic-->
  <script src="js/kaomoji.js"></script>
  <script src="js/popup.js"></script>

  <!--Stylesheet-->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="intro">
    <div id="header-row">
      <h2>Kaomojiboard</h2>
      <button id="settings-btn" type="button" aria-label="Settings" title="Settings">⚙️</button>
    </div>
    (*^▽^*) Click to copy! Tap a button below to filter.
  </div>

  <!-- Settings menu (toggled by the gear) -->
  <div id="settings-menu" hidden>
    <button class="menu-item" type="button" data-action="reset-recent">Reset recent history</button>
    <button class="menu-item" type="button" data-action="reset-favorites">Reset favorites</button>
  </div>

  <!-- Category filter pills -->
  <div id="filters">
    <button class="pill active" data-category="happy"   aria-pressed="true">happy</button>
    <button class="pill active" data-category="funny"   aria-pressed="true">funny</button>
    <button class="pill active" data-category="sad"     aria-pressed="true">sad</button>
    <button class="pill active" data-category="angry"   aria-pressed="true">angry</button>
    <button class="pill active" data-category="love"    aria-pressed="true">love</button>
    <button class="pill active" data-category="cute"    aria-pressed="true">cute</button>
    <button class="pill active" data-category="animals" aria-pressed="true">animals</button>
  </div>

  <!-- Pinned favorites (hidden until you save one) -->
  <div id="fav-wrap" hidden>
    <div class="cat-label">favorites</div>
    <div class="section" id="favorites"></div>
  </div>

  <!-- Pinned frequently used (hidden until there is click history) -->
  <div id="recent-wrap" hidden>
    <div class="cat-label">frequently used</div>
    <div class="section" id="recent"></div>
  </div>

  <!-- All categories, filled at runtime by popup.js -->
  <div id="all"></div>
</body>
</html>
